apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ra-no

resources:
  - ../../../base
  - authorization-client-onepassword.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-authorization-service_ra_no
      fintlabs.no/org-id: ra.no

patches:
  - patch: |-
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "ra-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "ra.no"
      - op: replace
        path: "/spec/ingress/routes/0/path"
        value: "/beta/ra-no/api/intern/authorization"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.flyt.web-resource-server.security.api.internal.authorized-org-id-role-pairs-json"
          value: |
            {
              "ra.no":["USER"],
              "vigo.no":["DEVELOPER","USER"],
              "novari.no":["DEVELOPER","USER"]
            }
      - op: add
        path: "/spec/env/-"
        value:
          name: "fint.flyt.digisak.available"
          value: "true"
      - op: add
        path: "/spec/env/-"
        value:
         name: "novari.kafka.topic.orgId"
         value: "ra-no"
      - op: add
        path: "/spec/env/-"
        value:
         name: "server.servlet.context-path"
         value: "/beta/ra-no"
      - op: replace
        path: "/spec/probes/startup/path"
        value: "/beta/ra-no/actuator/health"
      - op: replace
        path: "/spec/probes/readiness/path"
        value: "/beta/ra-no/actuator/health/readiness"
      - op: replace
        path: "/spec/probes/liveness/path"
        value: "/beta/ra-no/actuator/health/liveness"
      - op: replace
        path: "/spec/observability/metrics/path"
        value: "/beta/ra-no/actuator/prometheus"
    target:
      kind: Application
      name: fint-flyt-authorization-service
  - patch: |-
      - op: replace
        path: "/spec/env/5/valueFrom/secretKeyRef/key"
        value: "fint.flyt.authorization.sso.client-id"
      - op: add
        path: "/spec/env/-"
        value:
          name: "fint.flyt.authorization.sso.client-secret"
          valueFrom:
            secretKeyRef:
              name: fint-flyt-authorization-oauth2-client
              key: fint.flyt.authorization.sso.client-secret
    target:
      kind: Application
      name: fint-flyt-authorization-service

  - patch: |-
      - op: remove
        path: "/spec/env/4"
      - op: remove
        path: "/spec/env/3"
      - op: remove
        path: "/spec/env/2"
      - op: remove
        path: "/spec/env/1"
    target:
      kind: Application
      name: fint-flyt-authorization-service

  - target:
      group: fintlabs.no
      version: v1alpha1
      kind: NamOAuthClientApplicationResource
      name: fint-flyt-hmsreg-oauth2-client
    patch: |-
      apiVersion: fintlabs.no/v1alpha1
      kind: NamOAuthClientApplicationResource
      metadata:
        name: fint-flyt-hmsreg-oauth2-client
      $patch: delete

  - target:
      group: onepassword.com
      version: v1
      kind: OnePasswordItem
      name: fint-flyt-egrunnerverv-oauth2-client
    patch: |-
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: fint-flyt-egrunnerverv-oauth2-client
      $patch: delete

  - target:
      group: onepassword.com
      version: v1
      kind: OnePasswordItem
      name: fint-flyt-altinn-oauth2-client
    patch: |-
      apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: fint-flyt-altinn-oauth2-client
      $patch: delete

  - target:
      group: fintlabs.no
      version: v1alpha1
      kind: NamOAuthClientApplicationResource
      name: fint-flyt-vigo-oauth2-client
    patch: |-
      apiVersion: fintlabs.no/v1alpha1
      kind: NamOAuthClientApplicationResource
      metadata:
        name: fint-flyt-vigo-oauth2-client
      $patch: delete
