fint:
  org-id: novari.no
  flyt:
    authorization:
      sso:
        client-id: local-authorization-client

novari:
  flyt:
    security:
      user:
        audience: local-frontend-client
  kafka:
    topic:
      org-id: novari-no
      default-replicas: 1

spring:
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    hikari:
      schema: fintlabs_no
    url: jdbc:postgresql://localhost:5435/fint-flyt-authorization-service
    username: postgres
    password: password

  output:
    ansi:
      enabled: always

server:
  port: 8086
