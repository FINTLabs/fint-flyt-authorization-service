fint:
  application-id: fint-flyt-authorization-service
  flyt:
    # Source applications available by default. The overlays turn on the rest per namespace.
    altinn:
      available: true
    egrunnerverv:
      available: true
    hmsreg:
      available: true
    vigo:
      available: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
novari:
  flyt:
    authorization:
      access-control:
        permitted-approles:
          flyt-user: "https://role-catalog.vigoiks.no/vigo/flyt/user"
          flyt-developer: "https://role-catalog.vigoiks.no/vigo/flyt/developer"
        sync-schedule:
          initial-delay: 1s
          fixed-delay: 12h

spring:
  profiles:
    include:
      - flyt-kafka
      - flyt-logging
      - flyt-postgres
